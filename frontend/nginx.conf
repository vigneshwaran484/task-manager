server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Note: Content-Security-Policy (CSP) is tricky with local dev setups (Vite injects styles), 
    # but a baseline one is good for production. We'll keep it relatively open for the demo to prevent blocking UI.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000 https://*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # React Router HTML5 History fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html to ensure users get the latest app version
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Cache static assets (JS/CSS/images) aggressively since Vite hashes filenames
    location ~* \.(?:css|js|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Disable access logs for static assets to save disk I/O
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
