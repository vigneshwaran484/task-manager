[project]
name = "task-manager-backend"
version = "0.1.0"
description = "Task Manager FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",          # async postgres driver
    "alembic>=1.13.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Settings / validation
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",  # form data for OAuth2PasswordRequestForm
    # Observability (optional but worth mentioning)
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",            # async test client
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "B", "UP"]
ignore = [
    "S101",  # allow assert in tests
    "S105",  # hardcoded password false positives in auth helpers
    "B008",  # Depends() in FastAPI function defaults
    "E501",  # Line length
    "B904",  # raise from
    "UP042", # enum.StrEnum
    "F841",  # unused variable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
