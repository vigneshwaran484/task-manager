# Alembic configuration
# The sqlalchemy.url is NOT set here — it is overridden at runtime via env_var
# so the DB password never appears in this committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Read the DB URL from the same env var that the app uses
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
